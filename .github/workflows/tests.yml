name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install 'uv==0.11.13'
      - run: uv --config-file uv.toml sync --locked
      - run: uv --config-file uv.toml run pytest
      - run: uv --config-file uv.toml run ruff check .
      - run: uv --config-file uv.toml run ruff format --check .
