[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "waldofinder"
version = "0.1.0"
description = "Compare vision-language models on grid and binary-partition Waldo searches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "httpx>=0.28,<1",
    "pillow>=13,<14",
    "pymupdf>=1.26,<2",
]

[project.scripts]
waldofinder = "waldofinder.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = ["mistralai!=2.4.6", "guardrails-ai!=0.10.1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
